<title>TU PROFE CARLOS — Números Complejos y sus Operaciones</title>
<style>
:root{
  --ink:#16233F; --ink-2:#1F3358; --ink-3:#0E1729;
  --gold:#C9A227; --gold-dark:#9C7C15;
  --teal:#2F7A6B; --teal-dark:#215A4F;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--parchment);color:var(--text);font-family:var(--sans);}
body{padding-bottom:78px;}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);margin:0 0 8px;}

img{max-width:100%;}

/* HEADER */
header.appheader{
  background:linear-gradient(135deg,var(--ink),var(--ink-2));

header.appheader .owner{font-family:var(--serif);font-size:1.35rem;font-weight:700;}

main{max-width:760px;margin:0 auto;padding:14px 14px 30px;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);

.badge-offline{display:inline-block;margin-top:10px;background:rgba(255,255,255,.12);
  border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 14px;font-size:.75rem;letter-spacing:.06em;font-weight:700;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* BUTTONS */
.btn{display:inline-block;background:var(--teal);color:#fff;border:none;border-radius:8px;

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);

.storagepanel{font-size:.82rem;background:var(--parchment);border:1px dashed var(--line);border-radius:8px;padding:10px;}
.evalrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#fff;}

/* PRINT */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}

  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;margin:0;padding:0;}

  .printopts div{margin:2px 0;}

<script>
/* =========================================================================
   TU PROFE CARLOS — Números Complejos y sus Operaciones (Grado Noveno)
   Plataforma 100% offline — un solo archivo HTML autónomo
   ========================================================================= */

/* ============================= 1. ALMACENAMIENTO ============================= */
const DB = (function(){
  let engine = null; // 'indexeddb' | 'localstorage'
  let idb = null;
  const DB_NAME = 'tuProfeCarlosDB_complejos';
  const STORES = ['evaluaciones','resultados','config'];

  function openIDB(){
    return new Promise((resolve,reject)=>{
      if(!('indexedDB' in window)){ reject('no-idb'); return; }
      try{
        const req = indexedDB.open(DB_NAME,1);
        req.onupgradeneeded = function(e){
          const db = e.target.result;
          STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'}); });
        };
        req.onsuccess = function(e){ idb = e.target.result; resolve(idb); };
        req.onerror = function(){ reject('idb-error'); };
      }catch(err){ reject(err); }
    });
  }

  async function init(){
    try{
      await openIDB();
      engine = 'indexeddb';
    }catch(e){
      engine = 'localstorage';
      if(!localStorage.getItem('tpc_complejos')){
        localStorage.setItem('tpc_complejos', JSON.stringify({evaluaciones:[],resultados:[],config:[]}));
      }
    }
    return engine;
  }

  function lsData(){ return JSON.parse(localStorage.getItem('tpc_complejos')||'{"evaluaciones":[],"resultados":[],"config":[]}'); }
  function lsSave(d){ localStorage.setItem('tpc_complejos', JSON.stringify(d)); }

  function put(store, obj){
    return new Promise((resolve,reject)=>{
      if(engine==='indexeddb'){
        try{
          const tx = idb.transaction(store,'readwrite');
          tx.objectStore(store).put(obj);
          tx.oncomplete=()=>resolve(obj);
          tx.onerror=()=>reject(tx.error);
        }catch(err){ reject(err); }
      }else{
        const d = lsData();
        const arr = d[store] || (d[store]=[]);
        const idx = arr.findIndex(x=>x.id===obj.id);
        if(idx>=0) arr[idx]=obj; else arr.push(obj);
        lsSave(d); resolve(obj);
      }
    });
  }

  function getAll(store){
    return new Promise((resolve,reject)=>{
      if(engine==='indexeddb'){
        try{
          const tx = idb.transaction(store,'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess=()=>resolve(req.result||[]);
          req.onerror=()=>reject(req.error);
        }catch(err){ reject(err); }
      }else{
        const d = lsData();
        resolve(d[store]||[]);
      }
    });
  }

  function del(store, id){
    return new Promise((resolve,reject)=>{
      if(engine==='indexeddb'){
        try{
          const tx = idb.transaction(store,'readwrite');
          tx.objectStore(store).delete(id);
          tx.oncomplete=()=>resolve(true);
          tx.onerror=()=>reject(tx.error);
        }catch(err){ reject(err); }
      }else{
        const d = lsData();
        d[store] = (d[store]||[]).filter(x=>x.id!==id);
        lsSave(d); resolve(true);
      }
    });
  }

  return { init, put, getAll, del, engineName:()=>engine };
})();

/* ============================= 2. UTILIDADES ============================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randNonZero(min,max){ let v; do{ v=randInt(min,max); }while(v===0); return v; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtSigned(n){ return n>=0 ? '+ '+n : '− '+Math.abs(n); }
function complexToStr(a,b){
  if(b===0) return `${a}`;
  const bPart = (Math.abs(b)===1? 'i' : Math.abs(b)+'i');
  if(a===0) return (b<0? '−'+bPart : bPart);
  return `${a} ${b<0? '−':'+'} ${bPart}`;
}
function uid(prefix){ return prefix + Math.floor(100000+Math.random()*900000); }

/* Codificación simple (no criptográfica) para respuestas correctas dentro
   del archivo .formulario.json: Base64 + desplazamiento fijo (salt). */
const SALT = 37;
function encodeAnswer(indexNum){
  const shifted = indexNum + SALT;
  return btoa(String(shifted) + '::tpc');
}
function decodeAnswer(code){
  try{
    const raw = atob(code);
    const num = parseInt(raw.split('::')[0],10);
    return num - SALT;
  }catch(e){ return -1; }
}

/* ============================= 3. CONTEXTOS Y BANCO DE PREGUNTAS =============================
   TEMA: Números Complejos y sus Operaciones — Grado Noveno — Fundación, Magdalena
   Capacidad conceptual: 500 (5 niveles x 100), lograda por generación paramétrica
   (contextos x variables x variantes de redacción), NO por preguntas fijas.
*/
const CONTEXTOS = [
  {lugar:"un taller de electrónica del colegio, en Fundación (Magdalena)", obj:"dos impedancias eléctricas"},
  {lugar:"la feria de ciencias del I.E.D. John F. Kennedy", obj:"dos señales representadas como números complejos"},
  {lugar:"un dron agrícola que sobrevuela los cultivos de palma cerca de Fundación", obj:"dos posiciones registradas en el plano complejo"},
  {lugar:"la emisora comunitaria del municipio", obj:"dos ondas de radio representadas como complejos"},
  {lugar:"un videojuego que programan los estudiantes de noveno", obj:"dos vectores de movimiento en el plano complejo"},
  {lugar:"el mapa de rutas escolares de Fundación, Magdalena", obj:"dos puntos ubicados en el plano de Argand"},
  {lugar:"una canoa que navega por el río cercano a Fundación", obj:"dos desplazamientos representados como números complejos"},
  {lugar:"el laboratorio de física del colegio", obj:"dos mediciones de corriente eléctrica"},
  {lugar:"un plano de la finca ganadera de la región", obj:"dos coordenadas registradas como números complejos"},
  {lugar:"la antena de telecomunicaciones del municipio", obj:"dos señales complejas emitidas en distintos horarios"}
];

/* Errores conceptuales típicos por tipo de ejercicio (usados para construir distractores) */
const ERRORES = {
  suma:      ["error de signo al sumar la parte imaginaria","mezclar parte real con parte imaginaria","error aritmético simple en la suma"],
  resta:     ["error de signo al restar (no distribuir el signo menos)","mezclar parte real con parte imaginaria","error aritmético simple en la resta"],
  mult:      ["olvidar que i² = −1 (dejarlo como +1)","error de signo al distribuir el producto","error aritmético en alguno de los cuatro productos parciales"],
  conjugado: ["cambiar el signo de la parte real en vez de la imaginaria","no cambiar ningún signo","confundir conjugado con opuesto"],
  modulo:    ["olvidar la raíz cuadrada final (dejar la suma de cuadrados)","sumar los valores sin elevarlos al cuadrado","error de signo en uno de los cuadrados"],
  division:  ["no multiplicar por el conjugado del denominador","error de signo al racionalizar","aplicar mal el producto en el denominador (no usar diferencia de cuadrados)"]
};

function nivelNombre(n){
  return ["Básico","Intermedio","Avanzado","Profesional","Experto"][n-1];
}

/* ---- Construcción de un complejo aleatorio coherente según nivel ---- */
function randComplex(nivel){
  const rango = nivel<=2 ? [-9,9] : (nivel<=4 ? [-7,7] : [-6,6]);
  let a = randInt(rango[0],rango[1]);
  let b = randNonZero(rango[0],rango[1]);
  return {a,b};
}

/* ---- Generadores de opciones con distractores por error conceptual ---- */
function construirOpciones(correcta, generadorDistractor){
  const set = new Set([correcta]);
  const opciones = [correcta];
  let intentos = 0;
  while(opciones.length<4 && intentos<30){
    intentos++;
    const d = generadorDistractor();
    if(d===null || d===undefined) continue;
    const key = String(d);
    if(!set.has(key)){ set.add(key); opciones.push(d); }
  }
  // relleno de seguridad si no se completaron 4 opciones distintas
  while(opciones.length<4){
    const extra = correcta + '·' + randInt(1,9);
    if(!set.has(extra)){ set.add(extra); opciones.push(extra); }
  }
  const shuffled = shuffle(opciones.map((v,i)=>({v,orig:i===0})));
  const correctIndex = shuffled.findIndex(o=>o.orig);
  return { opciones: shuffled.map(o=>o.v), correctIndex };
}

/* ---- NIVEL 1: identificación básica ---- */
function genNivel1(){
  const tipo = pick(['parteReal','parteImag','clasificar','cuadrante']);
  const {a,b} = randComplex(1);
  const z = complexToStr(a,b);
  const ctx = pick(CONTEXTOS);

  if(tipo==='parteReal'){
    const correcta = String(a);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>String(a + pick([-3,-2,-1,1,2,3])));
    return {
      enunciado:`En ${ctx.lugar} se registra el número complejo z = ${z}. ¿Cuál es la parte real de z?`,
      opciones, correctIndex, tag:'Identificación',
      pasos:[`El número complejo tiene la forma a + bi, donde <b>a</b> es la parte real y <b>b</b> la parte imaginaria.`,
             `En z = ${z}, comparando con a + bi, se obtiene a = ${a}.`,
             `Por lo tanto, la parte real de z es <b>${a}</b>.`]
    };
  }
  if(tipo==='parteImag'){
    const correcta = String(b);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>String(b + pick([-3,-2,-1,1,2,3])));
    return {
      enunciado:`Un estudiante anota el número complejo z = ${z} al analizar ${ctx.obj} en ${ctx.lugar}. ¿Cuál es el coeficiente de la parte imaginaria de z?`,
      opciones, correctIndex, tag:'Identificación',
      pasos:[`En la forma binómica a + bi, el número que acompaña a "i" es la parte imaginaria (coeficiente b).`,
             `En z = ${z}, el coeficiente de i es ${b}.`,
             `Por lo tanto, la parte imaginaria de z es <b>${b}</b>.`]
    };
  }
  if(tipo==='clasificar'){
    const casos = [
      {txt:complexToStr(randNonZero(-8,8),0), resp:'Real puro (b = 0)'},
      {txt:complexToStr(0,randNonZero(-8,8)), resp:'Imaginario puro (a = 0)'},
      {txt:z, resp:'Complejo (a ≠ 0 y b ≠ 0)'}
    ];
    const caso = pick(casos);
    const opciones0 = ['Real puro (b = 0)','Imaginario puro (a = 0)','Complejo (a ≠ 0 y b ≠ 0)','No es un número complejo'];
    const correctIndex = opciones0.indexOf(caso.resp);
    return {
      enunciado:`Se tiene el número w = ${caso.txt}, registrado en ${ctx.lugar}. ¿Cómo se clasifica w?`,
      opciones:opciones0, correctIndex, tag:'Clasificación',
      pasos:[`Un número complejo a + bi es <b>real puro</b> si b = 0, <b>imaginario puro</b> si a = 0, y <b>complejo</b> si a ≠ 0 y b ≠ 0.`,
             `En w = ${caso.txt}, se observa que corresponde al caso: ${caso.resp}.`]
    };
  }
  // cuadrante
  const cuad = (a>0&&b>0)?'I':(a<0&&b>0)?'II':(a<0&&b<0)?'III':'IV';
  const opciones0 = shuffle(['I','II','III','IV']);
  const correctIndex = opciones0.indexOf(cuad);
  return {
    enunciado:`Al representar z = ${z} en el plano de Argand (eje horizontal: parte real, eje vertical: parte imaginaria), ¿en qué cuadrante se ubica el punto (${a}, ${b})?`,
    opciones:opciones0.map(c=>'Cuadrante '+c), correctIndex, tag:'Plano de Argand',
    pasos:[`En el plano de Argand, el eje horizontal representa la parte real y el eje vertical la parte imaginaria.`,
           `El punto (${a}, ${b}) tiene signo ${a>=0?'positivo':'negativo'} en el eje real y signo ${b>=0?'positivo':'negativo'} en el eje imaginario.`,
           `Eso corresponde al <b>cuadrante ${cuad}</b>.`]
  };
}

/* ---- NIVEL 2: suma y resta ---- */
function genNivel2(){
  const op = pick(['suma','resta']);
  const {a:a1,b:b1} = randComplex(2);
  const {a:a2,b:b2} = randComplex(2);
  const ctx = pick(CONTEXTOS);
  const z1 = complexToStr(a1,b1), z2 = complexToStr(a2,b2);

  if(op==='suma'){
    const ra = a1+a2, rb = b1+b2;
    const correcta = complexToStr(ra,rb);
    const errs = ERRORES.suma;
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
      const tipo = pick([0,1,2]);
      if(tipo===0) return complexToStr(ra, b1-b2); // error de signo
      if(tipo===1) return complexToStr(ra+rb, 0); // mezcla partes
      return complexToStr(ra+pick([-1,1]), rb+pick([-1,1])); // aritmético
    });
    return {
      enunciado:`En ${ctx.lugar} se registran ${ctx.obj}: z₁ = ${z1} y z₂ = ${z2}. Calcula z₁ + z₂.`,
      opciones, correctIndex, tag:'Suma de complejos',
      pasos:[`Para sumar números complejos se suman las partes reales entre sí y las partes imaginarias entre sí.`,
             `Parte real: ${a1} ${fmtSigned(a2)} = ${ra}.`,
             `Parte imaginaria: ${b1} ${fmtSigned(b2)} = ${rb}.`,
             `Entonces z₁ + z₂ = <b>${correcta}</b>.`],
      _err: errs
    };
  } else {
    const ra = a1-a2, rb = b1-b2;
    const correcta = complexToStr(ra,rb);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
      const tipo = pick([0,1,2]);
      if(tipo===0) return complexToStr(a1+a2, b1+b2); // no distribuye el signo
      if(tipo===1) return complexToStr(ra, b1+b2);
      return complexToStr(ra+pick([-1,1]), rb+pick([-1,1]));
    });
    return {
      enunciado:`Dos mediciones en ${ctx.lugar} son z₁ = ${z1} y z₂ = ${z2}. Calcula z₁ − z₂.`,
      opciones, correctIndex, tag:'Resta de complejos',
      pasos:[`Para restar, se resta la parte real de z₂ a la de z₁, y la parte imaginaria de z₂ a la de z₁ (distribuyendo el signo negativo).`,
             `Parte real: ${a1} − (${a2}) = ${ra}.`,
             `Parte imaginaria: ${b1} − (${b2}) = ${rb}.`,
             `Entonces z₁ − z₂ = <b>${correcta}</b>.`]
    };
  }
}

/* ---- NIVEL 3: multiplicación (y planteamiento simple) ---- */
function genNivel3(){
  const {a:a1,b:b1} = randComplex(3);
  const {a:a2,b:b2} = randComplex(3);
  const ctx = pick(CONTEXTOS);
  const z1 = complexToStr(a1,b1), z2 = complexToStr(a2,b2);
  const ra = a1*a2 - b1*b2;
  const rb = a1*b2 + a2*b1;
  const correcta = complexToStr(ra,rb);
  const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
    const tipo = pick([0,1,2]);
    if(tipo===0) return complexToStr(a1*a2+b1*b2, rb); // olvida que i²=-1 (suma en vez de restar)
    if(tipo===1) return complexToStr(ra, a1*b2 - a2*b1); // error de signo al distribuir
    return complexToStr(ra + pick([-2,-1,1,2]), rb + pick([-2,-1,1,2])); // error aritmético
  });
  return {
    enunciado:`Al analizar ${ctx.obj} en ${ctx.lugar}, se tienen z₁ = ${z1} y z₂ = ${z2}. Calcula z₁ × z₂.`,
    opciones, correctIndex, tag:'Multiplicación de complejos',
    pasos:[`Se aplica la propiedad distributiva: (a + bi)(c + di) = ac + adi + bci + bdi².`,
           `Como i² = −1, el término bdi² se convierte en −bd.`,
           `Parte real: (${a1})(${a2}) − (${b1})(${b2}) = ${a1*a2} − (${b1*b2}) = ${ra}.`,
           `Parte imaginaria: (${a1})(${b2}) + (${a2})(${b1}) = ${a1*b2} + ${a2*b1} = ${rb}.`,
           `Entonces z₁ × z₂ = <b>${correcta}</b>.`]
  };
}

/* ---- NIVEL 4: conjugado, módulo, división ---- */
function genNivel4(){
  const tipo = pick(['conjugado','modulo','division']);
  const ctx = pick(CONTEXTOS);

  if(tipo==='conjugado'){
    const {a,b} = randComplex(4);
    const z = complexToStr(a,b);
    const correcta = complexToStr(a,-b);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
      const t = pick([0,1]);
      if(t===0) return complexToStr(-a,b); // cambia el signo equivocado
      return z; // no cambia ningún signo
    });
    return {
      enunciado:`En ${ctx.lugar} se define z = ${z}. Halla el conjugado de z (z̄).`,
      opciones, correctIndex, tag:'Conjugado',
      pasos:[`El conjugado de a + bi es a − bi: se cambia únicamente el signo de la parte imaginaria.`,
             `Para z = ${z}, el conjugado es <b>${correcta}</b>.`]
    };
  }
  if(tipo==='modulo'){
    // Se eligen a,b tales que a²+b² sea cuadrado perfecto (ternas tipo 3-4-5)
    const ternas = [[3,4,5],[6,8,10],[5,12,13],[8,6,10],[4,3,5],[12,5,13],[9,12,15],[7,24,25]];
    const t = pick(ternas);
    const signoA = pick([1,-1]), signoB = pick([1,-1]);
    const a = t[0]*signoA, b = t[1]*signoB, mod = t[2];
    const z = complexToStr(a,b);
    const correcta = String(mod);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
      const type = pick([0,1,2]);
      if(type===0) return String(a*a+b*b); // olvida la raíz
      if(type===1) return String(Math.abs(a)+Math.abs(b)); // suma sin elevar al cuadrado
      return String(mod + pick([-2,-1,1,2]));
    });
    return {
      enunciado:`Se mide z = ${z} en ${ctx.lugar}. Calcula el módulo |z|.`,
      opciones, correctIndex, tag:'Módulo',
      pasos:[`El módulo de a + bi se calcula como |z| = √(a² + b²).`,
             `|z| = √((${a})² + (${b})²) = √(${a*a} + ${b*b}) = √${a*a+b*b}.`,
             `|z| = <b>${mod}</b>.`]
    };
  }
  // division
  const {a:a1,b:b1} = randComplex(4);
  let a2,b2;
  do{ a2=randInt(-5,5); b2=randNonZero(-5,5); }while(a2*a2+b2*b2===0);
  const den = a2*a2+b2*b2;
  // Ajuste para que el resultado sea razonable (no forzamos enteros exactos, se redondea a 2 decimales)
  const numA = a1*a2 + b1*b2;
  const numB = b1*a2 - a1*b2;
  const ra = Math.round((numA/den)*100)/100;
  const rb = Math.round((numB/den)*100)/100;
  const z1 = complexToStr(a1,b1), z2 = complexToStr(a2,b2);
  const correcta = complexToStr(ra,rb);
  const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
    const type = pick([0,1,2]);
    if(type===0) return complexToStr(Math.round((a1*a2 - b1*b2)/den*100)/100, Math.round((a1*b2+a2*b1)/den*100)/100); // no usa conjugado, resta directo
    if(type===1) return complexToStr(ra, -rb); // error de signo al racionalizar
    return complexToStr(Math.round((numA/den+0.5)*100)/100, rb);
  });
  return {
    enunciado:`En ${ctx.lugar} se necesita dividir dos complejos: z₁ = ${z1} entre z₂ = ${z2}. Calcula z₁ ÷ z₂ (forma binómica, resultado aproximado a 2 decimales si es necesario).`,
    opciones, correctIndex, tag:'División de complejos',
    pasos:[`Para dividir, se multiplica numerador y denominador por el conjugado del denominador: z̄₂ = ${complexToStr(a2,-b2)}.`,
           `Denominador: (${a2})² + (${b2})² = ${den}.`,
           `Numerador: (${z1})(${complexToStr(a2,-b2)}) = ${complexToStr(numA,numB)}.`,
           `z₁ ÷ z₂ = ${complexToStr(numA,numB)} / ${den} = <b>${correcta}</b>.`]
  };
}

/* ---- NIVEL 5: problemas multi-paso ---- */
function genNivel5(){
  const tipo = pick(['distancia','impedanciaTotal','multipasoOp']);
  const ctx = pick(CONTEXTOS);

  if(tipo==='distancia'){
    const ternas = [[3,4,5],[6,8,10],[5,12,13],[8,6,10],[9,12,15]];
    const t = pick(ternas);
    const {a:a1,b:b1} = randComplex(3);
    const a2 = a1 + t[0]*pick([1,-1]);
    const b2 = b1 + t[1]*pick([1,-1]);
    const dist = t[2];
    const z1 = complexToStr(a1,b1), z2 = complexToStr(a2,b2);
    const correcta = String(dist);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
      const type = pick([0,1]);
      if(type===0) return String((a2-a1)*(a2-a1)+(b2-b1)*(b2-b1));
      return String(dist + pick([-2,-1,1,2]));
    });
    return {
      enunciado:`Dos puntos de ${ctx.lugar} se registran como z₁ = ${z1} y z₂ = ${z2} en el plano complejo. La distancia entre ellos equivale al módulo de su diferencia. Calcula esa distancia |z₂ − z₁|.`,
      opciones, correctIndex, tag:'Problema multi-paso',
      pasos:[`Primero se calcula la diferencia: z₂ − z₁ = (${a2-a1}) + (${b2-b1})i.`,
             `Luego se halla el módulo: |z₂ − z₁| = √((${a2-a1})² + (${b2-b1})²) = √${(a2-a1)*(a2-a1)+(b2-b1)*(b2-b1)}.`,
             `Distancia = <b>${dist}</b> unidades.`]
    };
  }
  if(tipo==='impedanciaTotal'){
    const {a:a1,b:b1} = randComplex(3);
    const {a:a2,b:b2} = randComplex(3);
    const ra = a1+a2, rb = b1+b2;
    const correcta = complexToStr(ra,rb);
    const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
      const type = pick([0,1]);
      if(type===0) return complexToStr(ra, b1-b2);
      return complexToStr(ra+pick([-2,-1,1,2]), rb+pick([-2,-1,1,2]));
    });
    return {
      enunciado:`En un circuito armado en ${ctx.lugar}, dos impedancias en serie son Z₁ = ${complexToStr(a1,b1)} ohmios y Z₂ = ${complexToStr(a2,b2)} ohmios. La impedancia total es Zₜ = Z₁ + Z₂. Calcula Zₜ.`,
      opciones, correctIndex, tag:'Problema multi-paso',
      pasos:[`En un circuito en serie, las impedancias complejas se suman.`,
             `Parte real: ${a1} ${fmtSigned(a2)} = ${ra}.`,
             `Parte imaginaria: ${b1} ${fmtSigned(b2)} = ${rb}.`,
             `Zₜ = <b>${correcta}</b> ohmios.`]
    };
  }
  // multipasoOp: (z1+z2)*z3 sencillo con enteros pequeños
  const {a:a1,b:b1} = randComplex(4);
  const {a:a2,b:b2} = randComplex(4);
  let a3=randInt(-3,3), b3=randNonZero(-3,3);
  const sa=a1+a2, sb=b1+b2;
  const ra = sa*a3 - sb*b3;
  const rb = sa*b3 + a3*sb;
  const correcta = complexToStr(ra,rb);
  const {opciones, correctIndex} = construirOpciones(correcta, ()=>{
    const type = pick([0,1,2]);
    if(type===0) return complexToStr(sa*a3+sb*b3, rb); // olvida i²=-1
    if(type===1) return complexToStr(ra, sa*b3 - a3*sb);
    return complexToStr(ra+pick([-2,-1,1,2]), rb+pick([-2,-1,1,2]));
  });
  return {
    enunciado:`Un estudiante de noveno en ${ctx.lugar} registra tres complejos: z₁ = ${complexToStr(a1,b1)}, z₂ = ${complexToStr(a2,b2)} y z₃ = ${complexToStr(a3,b3)}. Calcula (z₁ + z₂) × z₃.`,
    opciones, correctIndex, tag:'Problema multi-paso',
    pasos:[`Primero se suma: z₁ + z₂ = ${complexToStr(sa,sb)}.`,
           `Luego se multiplica por z₃ = ${complexToStr(a3,b3)}, recordando que i² = −1.`,
           `Parte real: (${sa})(${a3}) − (${sb})(${b3}) = ${ra}.`,
           `Parte imaginaria: (${sa})(${b3}) + (${a3})(${sb}) = ${rb}.`,
           `Resultado = <b>${correcta}</b>.`]
  };
}

const GENERADORES = {1:genNivel1, 2:genNivel2, 3:genNivel3, 4:genNivel4, 5:genNivel5};

/* Genera una pregunta de un nivel, evitando duplicados dentro de una misma sesión/lista */
function generarPregunta(nivel, historial){
  historial = historial || [];
  let intento = 0, q;
  do{
    q = GENERADORES[nivel]();
    intento++;
  }while(historial.includes(q.enunciado) && intento<15);
  historial.push(q.enunciado);
  return q;
}

function generarSetProgresivo(cantidad){
  // Distribuye niveles de forma progresiva y, si son más de 5, en Mixto reparte proporcionalmente
  const niveles = [];
  if(cantidad<=5){
    for(let i=0;i<cantidad;i++) niveles.push(Math.min(5, Math.ceil(((i+1)/cantidad)*5)));
  } else {
    for(let i=0;i<cantidad;i++) niveles.push(1+(i%5));
    niveles.sort((a,b)=>a-b);
  }
  const historial = [];
  return niveles.map(n=>{
    const q = generarPregunta(n, historial);
    q.nivel = n;
    return q;
  });
}

function generarSetPorNivelFijo(nivel, cantidad){
  const historial = [];
  const out=[];
  for(let i=0;i<cantidad;i++){
    const q = generarPregunta(nivel, historial);
    q.nivel = nivel;
    out.push(q);
  }
  return out;
}

function generarSetMixto(cantidad){
  const out=[];
  const historial=[];
  for(let i=0;i<cantidad;i++){
    const n = 1+(i%5);
    const q = generarPregunta(n, historial);
    q.nivel = n;
    out.push(q);
  }
  return out.sort((a,b)=>a.nivel-b.nivel);
}

      <p><b>Resta:</b> parte real 4 − (−1) = 5; parte imaginaria 2 − 5 = −3. Entonces Z₁ − Z₂ = 5 − 3i.</p>
    </div>
  </div>
  <div class="card">
    <span class="tag" style="background:var(--ink);">Ejemplo 3 · Avanzado</span>
    <p>En la antena de telecomunicaciones del municipio se combinan dos señales: z₁ = 2 + 3i y z₂ = 1 − 4i. Calcula z₁ × z₂ y el módulo del resultado.</p>
    <div class="pasos">
      <p><b>Multiplicación:</b> (2 + 3i)(1 − 4i) = (2)(1) + (2)(−4i) + (3i)(1) + (3i)(−4i)</p>
      <p>= 2 − 8i + 3i − 12i² = 2 − 5i − 12(−1) = 2 − 5i + 12 = 14 − 5i.</p>
      <p><b>Módulo:</b> |14 − 5i| = √(14² + (−5)²) = √(196 + 25) = √221 ≈ 14.87.</p>
    </div>
  </div>

  <div class="section-title"><span class="num">7</span><h3>Mini práctica</h3></div>
  <div class="card">
    <p>Responde estas 3 preguntas (suben de nivel progresivamente). Al responder verás el procedimiento completo.</p>
    <button class="btn gold block" onclick="regenerarMiniPractica()">🔄 Generar preguntas nuevas</button>
    <div id="miniPracticaBox">${renderMiniPractica(mini)}</div>
  </div>`;
}

function svgPlanoArgand(a,b){
  const cx=110, cy=90, scale=9;
  const px = cx + a*scale, py = cy - b*scale;
  return `<svg viewBox="0 0 220 180" width="220" height="180" xmlns="http://www.w3.org/2000/svg">
    <line x1="10" y1="${cy}" x2="210" y2="${cy}" stroke="#5B6472" stroke-width="1"/>
    <line x1="${cx}" y1="10" x2="${cx}" y2="170" stroke="#5B6472" stroke-width="1"/>
    <text x="200" y="${cy-4}" font-size="9" fill="#5B6472">Re</text>
    <text x="${cx+4}" y="16" font-size="9" fill="#5B6472">Im</text>
    <line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#C9A227" stroke-width="2"/>
    <circle cx="${px}" cy="${py}" r="4.5" fill="#2F7A6B"/>
    <text x="${px+7}" y="${py-4}" font-size="10" fill="#16233F">(${a}, ${b})</text>
  </svg>`;
}

  const input = document.getElementById('fileFormulario');

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.tipo || data.tipo!=='formulario-tpc'){ throw new Error('formato'); }
      state.examenActual = data;
      state.examenRespuestas = new Array(data.preguntas.length).fill(null);

async function eliminarEvaluacion(id){
  if(!confirm('¿Eliminar esta evaluación? Se borrarán también sus resultados asociados.')) return;
  const resultados = await DB.getAll('resultados');
  const asociados = resultados.filter(r=>r.formularioId===id);
  for(const r of asociados) await DB.del('resultados', r.id);
  await DB.del('evaluaciones', id);
  toast('Evaluación eliminada');
  renderMisEvaluaciones();
  actualizarPanelStorage();
}

  let html = `<div class="printq" style="font-family:sans-serif;font-size:13px;">`;
  html += `Carlos Andrés Romero Mendivil — TU PROFE CARLOS<br>Asignatura: ${ev.asignatura} · Grado: ${ev.grado} · Tema: ${ev.tema}<br>Formulario: ${ev.nombreEvaluacion} (${ev.id})<br><br>
  Nombre: _______________________________ &nbsp; Curso: _________ &nbsp; Fecha: _________<br><hr></div>`;
  ev.preguntas.forEach((q,i)=>{
    html += `<div class="printq"><b>${i+1}.</b> ${q.enunciado}<div class="printopts">`;
    q.opciones.forEach((op,j)=> html += `<div>${letras[j]}. ${op}</div>`);
    html += `</div></div>`;
  });
  html += `<div class="pagebreak"></div><div class="printq"><b>SOLUCIONARIO — ${ev.id}</b><br></div>`;
  ev.preguntas.forEach((q,i)=>{
    const correcto = decodeAnswer(q.respuestaCodificada);
    html += `<div class="printq"><b>${i+1}.</b> ${q.enunciado}<br><b>Respuesta correcta:</b> ${letras[correcto]}. ${q.opciones[correcto]}<br>`;
    (q.pasos||[]).forEach(p=> html += `${p.replace(/<[^>]*>/g,'')}<br>`);
    html += `</div>`;
  });
  area.innerHTML = html;
  window.print();
}

function renderImportarResultados(){
  return `
  <div class="card">
    <h3>Importar resultados</h3>
    <p>Selecciona el archivo <b>.resultado.json</b> enviado por el estudiante.</p>
    <input type="file" id="fileResultado" accept=".json">
    <button class="btn block" onclick="importarResultado()">Importar y calificar</button>
    <div id="importResMsg"></div>
  </div>`;
}
async function importarResultado(){
  const input = document.getElementById('fileResultado');
  if(!input.files.length){ toast('Selecciona un archivo primero'); return; }
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(data.tipo!=='resultado-tpc') throw new Error('formato');
      const evals = await DB.getAll('evaluaciones');
      const ev = evals.find(x=>x.id===data.formularioId);
      if(!ev) throw new Error('sin-formulario');
      let aciertos = 0;
      ev.preguntas.forEach((q,i)=>{
        const correcto = decodeAnswer(q.respuestaCodificada);
        if(data.respuestas[i]===correcto) aciertos++;
      });
      const total = ev.preguntas.length;
      const notaSugerida = Math.round((state.siee.min + (aciertos/total)*(state.siee.max-state.siee.min))*100)/100;
      const resultado = {
        id: uid('RES-'), formularioId: ev.id, nombreEvaluacion: ev.nombreEvaluacion,
        estudiante: data.estudiante, aciertos, total, notaSugerida, notaFinal: notaSugerida,
        fechaImportado: new Date().toISOString()
      };
      await DB.put('resultados', resultado);
      document.getElementById('importResMsg').innerHTML = `<div class="okbox">Resultado importado: ${data.estudiante.nombre} — ${aciertos}/${total} aciertos — Nota sugerida: ${notaSugerida}</div>`;
      actualizarPanelStorage();
    }catch(err){
      document.getElementById('importResMsg').innerHTML = `<div class="errbox">No se pudo importar: archivo inválido o el formulario correspondiente ya no existe.</div>`;
    }
  };
  reader.readAsText(input.files[0]);
}

async function renderResultadosRecibidos(){
  const resultados = await DB.getAll('resultados');
  const box = document.getElementById('docenteSub');
  if(resultados.length===0){ box.innerHTML = `<div class="card"><p>Aún no se han recibido resultados.</p></div>`; return; }
  box.innerHTML = `<div class="card">
    <h3>Resultados recibidos</h3>
    ${resultados.map(r=>`
      <div class="evalrow">
        <b>${r.estudiante.nombre}</b> (${r.estudiante.grado||'-'} ${r.estudiante.curso||''})<br>
        <span style="font-size:.85rem;">${r.nombreEvaluacion} — ${r.aciertos}/${r.total} aciertos</span><br>
        <label style="margin-top:6px;">Nota final</label>
        <input type="number" step="0.1" value="${r.notaFinal}" style="max-width:120px;" onchange="actualizarNota('${r.id}', this.value)">
        <div class="acts"><button class="btn small" onclick="imprimirResultadoIndividual('${r.id}')">🖨️ PDF individual</button></div>
      </div>
    `).join('')}
    <button class="btn gold block" style="margin-top:10px;" onclick="imprimirReporteGeneral()">🖨️ Reporte general del grupo (PDF)</button>
  </div>`;
}
async function actualizarNota(id, val){
  const resultados = await DB.getAll('resultados');
  const r = resultados.find(x=>x.id===id);
  r.notaFinal = parseFloat(val);
  await DB.put('resultados', r);
  toast('Nota actualizada');
}
async function imprimirResultadoIndividual(id){
  const resultados = await DB.getAll('resultados');
  const r = resultados.find(x=>x.id===id);
  const area = document.getElementById('printArea');
  area.innerHTML = `<div class="printq" style="font-family:sans-serif;font-size:13px;">
    Carlos Andrés Romero Mendivil — TU PROFE CARLOS<br>Reporte individual de resultado<br><br>
    Estudiante: ${r.estudiante.nombre}<br>Grado: ${r.estudiante.grado||'-'} · Curso: ${r.estudiante.curso||'-'}<br>
    Evaluación: ${r.nombreEvaluacion} (${r.formularioId})<br>
    Aciertos: ${r.aciertos} / ${r.total}<br>Nota sugerida (SIEE): ${r.notaSugerida}<br>Nota final: <b>${r.notaFinal}</b><br>
    Fecha: ${new Date(r.fechaImportado).toLocaleDateString()}
  </div>`;
  window.print();
}
async function imprimirReporteGeneral(){
  const resultados = await DB.getAll('resultados');
  const area = document.getElementById('printArea');
  let html = `<div class="printq" style="font-family:sans-serif;font-size:13px;">Carlos Andrés Romero Mendivil — TU PROFE CARLOS<br>Reporte general de resultados<br><br></div>`;
  html += `<table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:12px;">
    <tr style="border-bottom:1px solid #000;"><th align="left">Estudiante</th><th align="left">Grado</th><th align="left">Evaluación</th><th align="left">Aciertos</th><th align="left">Nota</th></tr>
    ${resultados.map(r=>`<tr style="border-bottom:1px solid #ccc;"><td>${r.estudiante.nombre}</td><td>${r.estudiante.grado||'-'}</td><td>${r.nombreEvaluacion}</td><td>${r.aciertos}/${r.total}</td><td>${r.notaFinal}</td></tr>`).join('')}
  </table>`;
  area.innerHTML = html;
  window.print();
}

/* ============================= 10. RENDER PRINCIPAL ============================= */
function render(){
  const app = document.getElementById('app');
  if(state.view==='inicio') app.innerHTML = viewInicio();
  else if(state.view==='aprender') app.innerHTML = viewAprender();
  else if(state.view==='resueltos') app.innerHTML = viewResueltos();
  else if(state.view==='estudiante') app.innerHTML = viewEstudiante();
  else if(state.view==='docente'){ app.innerHTML = viewDocente(); if(state.docenteAutenticado) actualizarPanelStorage(); }
}

/* ============================= 11. INICIALIZACIÓN ============================= */
window.onload = async function(){
  await DB.init();
  setActiveNav('inicio');
  render();
};
</script>
